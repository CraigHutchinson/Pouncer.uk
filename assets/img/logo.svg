<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="Pouncer">
  <title>Pouncer</title>
  <!-- Motion arc: the pounce trajectory. -->
  <path d="M3 33 C 10 33, 12 9, 21 9 C 29 9, 32 20, 37 24"
        fill="none" stroke="#e0992f" stroke-width="3" stroke-linecap="round"/>
  <!-- Ears: the cat, reduced to two marks. -->
