<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 540" role="img"
     aria-label="Preliminary exploded view of the Pouncer module: top shell with LED and acoustic port, piezo sounder, circuit board carrying the accelerometer and microcontroller, cell, and collar clip.">
  <title>Inside the module — preliminary exploded view</title>
  <defs>
    <linearGradient id="xShell" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f2ee"/><stop offset="1" stop-color="#cfcbc2"/>
    </linearGradient>
    <linearGradient id="xPiezo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8c65c"/><stop offset="1" stop-color="#b98f1e"/>
    </linearGradient>
    <linearGradient id="xPcb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e6f4a"/><stop offset="1" stop-color="#124a31"/>
    </linearGradient>
    <linearGradient id="xCell" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d7dbe2"/><stop offset="1" stop-color="#9aa1ad"/>
    </linearGradient>
    <linearGradient id="xClip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a5573"/><stop offset="1" stop-color="#232b42"/>
    </linearGradient>
  </defs>

  <!-- alignment axis through the stack -->
  <path d="M250 118 L250 470" stroke="#c9c4ba" stroke-width="1.5" stroke-dasharray="4 6"/>
  <path d="M410 90 L410 442" stroke="#c9c4ba" stroke-width="1.5" stroke-dasharray="4 6"/>

  <g transform="skewY(-9)">
    <!-- 1. top shell -->
    <g>
      <rect x="90" y="128" width="320" height="10" rx="5" fill="#b3aea4"/>
      <rect x="90" y="112" width="320" height="20" rx="9" fill="url(#xShell)"/>
      <circle cx="356" cy="122" r="7" fill="#e0992f"/>
      <g fill="#8d887d"><circle cx="132" cy="122" r="2.2"/><circle cx="141" cy="122" r="2.2"/>
        <circle cx="150" cy="122" r="2.2"/><circle cx="136.5" cy="117" r="2.2"/>
        <circle cx="145.5" cy="117" r="2.2"/></g>
    </g>
    <!-- 2. piezo -->
    <g>
      <rect x="150" y="204" width="200" height="8" rx="4" fill="#8a6a15"/>
      <rect x="150" y="192" width="200" height="16" rx="8" fill="url(#xPiezo)"/>
      <circle cx="250" cy="200" r="24" fill="#d9b23f" stroke="#a8811c" stroke-width="1.5"/>
      <circle cx="250" cy="200" r="9" fill="#a8811c"/>
    </g>
    <!-- 3. board -->
    <g>
      <rect x="100" y="284" width="300" height="8" rx="3" fill="#0d3723"/>
      <rect x="100" y="272" width="300" height="16" rx="4" fill="url(#xPcb)"/>
      <rect x="130" y="274" width="34" height="12" rx="2" fill="#2b2f36"/>
      <rect x="196" y="274" width="46" height="12" rx="2" fill="#2b2f36"/>
      <g fill="#c9a227" opacity="0.85">
        <rect x="270" y="278" width="46" height="2.5" rx="1"/>
        <rect x="270" y="283" width="64" height="2.5" rx="1"/>
        <rect x="340" y="276" width="8" height="8" rx="1"/>
      </g>
    </g>
    <!-- 4. cell -->
    <g>
      <rect x="170" y="364" width="160" height="12" rx="6" fill="#7e858f"/>
      <rect x="170" y="348" width="160" height="20" rx="10" fill="url(#xCell)"/>
      <text x="250" y="362" fill="#5c626c" font-family="system-ui, sans-serif"
            font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">CELL</text>
    </g>
    <!-- 5. clip -->
    <g>
      <rect x="90" y="444" width="320" height="12" rx="6" fill="#161c2e"/>
      <rect x="90" y="428" width="320" height="20" rx="9" fill="url(#xClip)"/>
      <rect x="200" y="432" width="100" height="12" rx="6" fill="#5e6982" opacity="0.6"/>
    </g>
  </g>

  <!-- leaders and labels -->
  <g stroke="#b9b4aa" stroke-width="1.5" fill="none">
    <path d="M418 78 H470"/><path d="M358 168 H470"/>
    <path d="M408 250 H470"/><path d="M338 336 H470"/><path d="M418 410 H470"/>
  </g>
  <g font-family="system-ui, sans-serif">
    <text x="482" y="74" fill="#16181d" font-size="14.5" font-weight="650">Top shell</text>
    <text x="482" y="92" fill="#5a6071" font-size="12.5">LED lens and acoustic port</text>

    <text x="482" y="164" fill="#16181d" font-size="14.5" font-weight="650">Piezo sounder</text>
    <text x="482" y="182" fill="#5a6071" font-size="12.5">directed forward, away from the cat</text>

    <text x="482" y="246" fill="#16181d" font-size="14.5" font-weight="650">Board</text>
    <text x="482" y="264" fill="#5a6071" font-size="12.5">accelerometer at 100 Hz, plus the</text>
    <text x="482" y="280" fill="#5a6071" font-size="12.5">microcontroller and event log</text>

    <text x="482" y="332" fill="#16181d" font-size="14.5" font-weight="650">Cell</text>
    <text x="482" y="350" fill="#5a6071" font-size="12.5">user-replaceable — a design</text>
    <text x="482" y="366" fill="#5a6071" font-size="12.5">commitment, not a tested figure</text>

    <text x="482" y="406" fill="#16181d" font-size="14.5" font-weight="650">Collar clip</text>
    <text x="482" y="424" fill="#5a6071" font-size="12.5">fits a standard quick-release strap</text>
  </g>

  <g transform="translate(24 24)">
    <rect x="0" y="0" width="250" height="28" rx="14" fill="none" stroke="#e0992f" stroke-width="1.5"/>
    <text x="125" y="19" fill="#e0992f" font-family="system-ui, sans-serif" font-size="11.5"
          font-weight="700" letter-spacing="1.6" text-anchor="middle">PRELIMINARY — LAYOUT NOT FINAL</text>
  </g>
</svg>
