<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img"
     aria-label="Diagram: a cat's motion trace moves from observe, through stalk, to a confirmed launch where a single directional chirp sounds.">
  <title>Observe, stalk, launch</title>
  <defs>
    <linearGradient id="trace" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5a6790"/>
      <stop offset="0.55" stop-color="#8f7fa8"/>
      <stop offset="1" stop-color="#e0992f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0992f" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#e0992f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ground reference -->
  <line x1="24" y1="360" x2="496" y2="360" stroke="#39425e" stroke-width="1.5" stroke-dasharray="2 8" stroke-linecap="round"/>

  <!-- Sampling grid: 100 Hz inertial stream -->
  <g stroke="#232c45" stroke-width="1">
    <line x1="24" y1="80" x2="496" y2="80"/>
    <line x1="24" y1="160" x2="496" y2="160"/>
    <line x1="24" y1="240" x2="496" y2="240"/>
  </g>

  <!-- Quiet signal, then the launch spike -->
  <path d="M28 320 l10 -4 l8 8 l10 -6 l9 5 l11 -3 l9 4 l10 -5 l9 3 l10 -2
           l10 4 l9 -6 l10 5 l9 -3 l10 2 l9 -4 l10 6 l9 -3"
        fill="none" stroke="#39425e" stroke-width="2" stroke-linejoin="round"/>

  <!-- Motion trace: stalk to launch -->
  <path d="M218 322 C 268 318, 300 300, 332 252 C 360 210, 392 150, 452 122"
        fill="none" stroke="url(#trace)" stroke-width="4" stroke-linecap="round"
        stroke-dasharray="1 11"/>

  <!-- Stage 1: observe -->
  <g>
    <circle cx="66" cy="300" r="8" fill="none" stroke="#5a6790" stroke-width="2"/>
    <circle cx="66" cy="300" r="2.5" fill="#5a6790"/>
    <text x="66" y="338" fill="#8d96ad" font-family="system-ui, sans-serif"
          font-size="13" font-weight="600" letter-spacing="1.6" text-anchor="middle">OBSERVE</text>
  </g>

  <!-- Stage 2: stalk -->
  <g>
    <circle cx="218" cy="322" r="9" fill="none" stroke="#8f7fa8" stroke-width="2"/>
    <circle cx="218" cy="322" r="3.5" fill="#8f7fa8"/>
    <text x="218" y="360" fill="#a294b8" font-family="system-ui, sans-serif"
          font-size="13" font-weight="600" letter-spacing="1.6" text-anchor="middle">STALK</text>
  </g>

  <!-- Stage 3: launch + single directional chirp -->
  <g>
    <circle cx="332" cy="252" r="58" fill="url(#glow)"/>
    <circle cx="332" cy="252" r="11" fill="#e0992f"/>
    <g fill="none" stroke="#e0992f" stroke-width="2.5" stroke-linecap="round">
      <path d="M352 232 a 28 28 0 0 1 0 40" opacity="0.9"/>
      <path d="M364 220 a 45 45 0 0 1 0 64" opacity="0.6"/>
      <path d="M376 208 a 62 62 0 0 1 0 88" opacity="0.32"/>
    </g>
    <text x="332" y="196" fill="#e0992f" font-family="system-ui, sans-serif"
          font-size="13" font-weight="700" letter-spacing="1.6" text-anchor="middle">LAUNCH</text>
  </g>

  <!-- Warned bird, already moving -->
  <g stroke="#f4f2ee" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M436 124 q 12 -14 24 -2"/>
    <path d="M460 122 q 12 -14 24 -2"/>
  </g>

  <text x="28" y="56" fill="#6b7591" font-family="system-ui, sans-serif"
        font-size="12" letter-spacing="1.4">100 Hz INERTIAL STREAM</text>
</svg>
